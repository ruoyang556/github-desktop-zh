name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 词典校验
        shell: pwsh
        run: ./tools/validate-dict.ps1

      - name: 语法检查
        shell: pwsh
        run: |
          $files = @('一键汉化.ps1', 'tools/validate-dict.ps1', 'tools/pack-release.ps1')
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) { Write-Error ($f + ': ' + $errors[0].Message); exit 1 }
          }
          foreach ($f in @('out/zh-cn.js', 'out/zh-menu-hook.js')) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Write-Host '[OK] 语法检查通过'

      - name: 打包 zip
        shell: pwsh
        run: ./tools/pack-release.ps1

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            下载 zip 解压后，在解压目录运行：

                pwsh -File .\一键汉化.ps1

            还原原版：

                pwsh -File .\一键汉化.ps1 -Restore
